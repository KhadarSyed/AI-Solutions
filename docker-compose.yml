name: prsolutions

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: prsol
      POSTGRES_PASSWORD: prsol
      POSTGRES_DB: prsol
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prsol -d prsol"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    restart: unless-stopped
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/prsolneo4j
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7475:7474"   # browser UI
      - "7688:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  searxng:
    restart: unless-stopped
    image: searxng/searxng:latest
    ports:
      - "8083:8080"
    volumes:
      - ./docker/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8083/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://prsol:prsol@postgres:5432/prsol
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      SEARXNG_URL: http://searxng:8080
      SMTP_HOST: greenmail
      IMAP_HOST: greenmail
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload"

  sandbox:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    container_name: prsol-sandbox
    network_mode: none
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - sandbox_tmp:/sandbox
    command: ["tail", "-f", "/dev/null"]
    profiles: ["sandbox"]

  greenmail:
    restart: unless-stopped
    image: greenmail/standalone:2.1.0
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
    environment:
      # auth.disabled: accept any login/password and auto-create mailboxes (test server only)
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
    profiles: ["email"]

volumes:
  pg_data:
  redis_data:
  neo4j_data:
  sandbox_tmp:
