[project]
name = "pr-intelligence-agent"
version = "0.1.0"
description = "PR Intelligence Agent — multi-agent media monitoring and PR analytics platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "python-multipart>=0.0.9",
    # Core validation / config
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # DB / storage
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5",
    # Orchestration + agents
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.1",
    "pydantic-ai>=0.2",
    "logfire>=3",
    # Memory
    "mem0ai[graph]>=0.1.90",
    # Retrieval / rerank
    "flashrank>=0.2",
    # Guardrails
    "nemoguardrails>=0.11",
    # HTTP / ingestion
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "ddgs>=9",
    "scrapling>=0.2",
    "playwright>=1.47",
    "tavily-python>=0.5",
    "lingua-language-detector>=2.0",
    # Data / reports
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    # Observability
    "structlog>=24",
    "prometheus-client>=0.20",
    # Utilities
    "tenacity>=9",
    "python-dateutil>=2.9",
    "tzdata",
    # Channels (Phase D)
    "mcp>=1.1",
    "aiosmtplib>=3",
    "aioimaplib>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "faker>=28",
    "langgraph-cli[inmem]>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
