# Render Blueprint — PR Intelligence Agent production backend.
# Docs: https://render.com/docs/blueprint-spec
#
# What this provisions:
#   - prsol-api      : the always-on Docker web service (API + LangGraph workers +
#                      the 5-second email/Teams poll loop). MUST be a paid plan so it
#                      never spins down (free tier sleeps and would stop polling).
#   - prsol-postgres : managed Postgres 16 (enable the `vector` extension — see runbook).
#   - prsol-redis    : managed Key Value (Redis) for the event bus, cache, sessions.
#   - a 1 GB disk mounted at /app/data/local so the teams-mcp OAuth token survives deploys.
#
# Neo4j is NOT offered by Render — use Neo4j AuraDB (free tier) and set NEO4J_* below.
# Secrets (sync:false) are entered in the Render dashboard, never committed.

services:
  - type: web
    name: prsol-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: standard                     # always-on; do NOT use free (it sleeps)
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: prsol-data
      mountPath: /app/data/local       # persists data/local/teams_token.json
      sizeGB: 1
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # --- wired automatically from the managed resources ---
      - key: REDIS_URL
        fromService: { type: keyvalue, name: prsol-redis, property: connectionString }
      - key: ADMIN_API_KEY
        generateValue: true
      # --- set in the dashboard (secrets / values you provide) ---
      # DATABASE_URL: paste the prsol-postgres *Internal* URL but with the async driver,
      #   i.e. postgresql+asyncpg://USER:PASS@HOST/DB  (Render gives postgresql://…)
      - { key: DATABASE_URL,                sync: false }
      - { key: NEO4J_URI,                   sync: false }   # neo4j+s://xxxx.databases.neo4j.io
      - { key: NEO4J_USERNAME,              sync: false }
      - { key: NEO4J_PASSWORD,              sync: false }
      - { key: LLM_PROVIDER,                value: claude }
      - { key: ANTHROPIC_API_KEY,           sync: false }
      - { key: AZURE_OPENAI_API_KEY,        sync: false }
      - { key: AZURE_OPENAI_ENDPOINT,       sync: false }
      - { key: AZURE_OPENAI_CHAT_DEPLOYMENT,  value: gpt-4o }
      # Embeddings default to the bundled local ONNX model (no external API needed).
      # Set EMBEDDING_BACKEND=azure + a REAL AZURE_OPENAI_EMBED_DEPLOYMENT to use Azure.
      - { key: EMBEDDING_BACKEND,           value: local }
      - { key: AZURE_OPENAI_EMBED_DEPLOYMENT, sync: false }
      # Public HTTPS base the in-report chat calls back to. Set to this service's URL,
      # e.g. https://prsol-api.onrender.com — so "Ask the data agent" reaches the backend
      # from the Vercel-hosted report (localhost is never reachable off the box).
      - { key: PUBLIC_API_BASE,             sync: false }
      - { key: TEAMS_MCP_URL,               value: https://teams-mcp-emrk.onrender.com/mcp }
      - { key: XPOZ_API_KEY,                sync: false }
      - { key: XPOZ_MCP_URL,                value: https://mcp.xpoz.ai/mcp }
      - { key: SERPAPI_API_KEY,             sync: false }
      - { key: TAVILY_API_KEY,              sync: false }
      - { key: APIFY_TOKEN,                 sync: false }
      - { key: PEXELS_API_KEY,              sync: false }
      - { key: SEARXNG_URL,                 value: "" }      # empty = disabled in prod
      - { key: DASHBOARD_ASSET_MODE,        value: cdn }
      - { key: VERCEL_TOKEN,                sync: false }     # for automated per-report deploys
      - { key: WATCHFILES_FORCE_POLLING,    value: "false" }

  - type: keyvalue
    name: prsol-redis
    plan: standard
    ipAllowList: []                    # only reachable from Render services
    maxmemoryPolicy: noeviction

databases:
  - name: prsol-postgres
    plan: standard
    postgresMajorVersion: "16"
